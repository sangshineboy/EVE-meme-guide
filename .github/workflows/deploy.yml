name: 构建与发布

# 默认行为：**只构建校验**（每次 push / PR 都跑，能立刻看出格式或渲染是否坏掉）。
# 发布到 GitHub Pages 需要显式打开开关，因为：
#   · 私有仓库 + 免费账号不支持 Pages；
#   · 未开启 Pages 时，configure-pages 步骤会直接失败，让每次 push 都变红。
#
# 要发布时：仓库 Settings → Secrets and variables → Actions → Variables
#   新增仓库变量 ENABLE_PAGES = true
# 再去 Settings → Pages 把 Source 选成 "GitHub Actions"。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 完整历史：词条“核对日期”与提交历史对照时用得上
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run doctor && npm test

      # 只有显式开启时才准备 Pages（否则此步会失败）
      - id: pages
        if: vars.ENABLE_PAGES == 'true'
        uses: actions/configure-pages@v5

      - run: npm run build
        env:
          # 未开启 Pages 时按根路径构建（与 npm run serve 口径一致）
          PATH_PREFIX: ${{ vars.ENABLE_PAGES == 'true' && steps.pages.outputs.base_path || '/' }}

      - if: vars.ENABLE_PAGES == 'true' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - if: vars.ENABLE_PAGES != 'true'
        run: echo "未开启发布（ENABLE_PAGES != true）：本次只做构建校验。要上线请看本文件顶部说明。"

  deploy:
    if: vars.ENABLE_PAGES == 'true' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
